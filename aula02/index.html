<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02 - cartão de Produto</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Area do nosso conteudo Principal -->
    <main>
        <!-- Container Principal
         Div wrapper usada para centralizar o cartão na pagina 
         O css ( display:flex) vai centralizar este centralizar ester elementos -->
        <div class="container">

            <!-- Cartão de Produto ( product card)
             Estrutura que contem : imagem, titulos,descrição, preço e botão esteé um padrão comem em - comerce -->
            <div class="product-card">
              <img src="img/celular-001.webp" alt="Produto">
              
              <!-- Contéudo Interno do cartão -->
              <div class="card-content">
                
                <h3>Smartphone tech X</h3>

                <p> O Smatphone mais avançado do mercado, com camera de 108mP</p>
                <span class="price">R$ 2.000</span>
                <a href="#" class="buy-btn">Compra Agora</a>
               </div>
            </div>
        </div>
    </main>
</body>
</html>
