<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03 - Receita e FlexBox </title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <div class="recipe-container">

        <h1>Bolo de cenoura com Chocolate</h1>

        <section class="Ingredientes">
            <h2>Ingredientes</h2>
            <ul class="flex-list">
                <li>3 cenoura Medias</li>
                <li>3 ovos</li>
                <li>50 ml xicara de oleo</li>
                <li>2 xicaras de Açucar</li>
                <li>2 xicaras de farinha de trigo</li>
                <li>1 colher de fermento</li>
            </ul>
        </section>

<section class="info">
    <h2>Informações Nutricionais</h2>
     <!-- Tabela Responsiva -->
      <!-- Tabela que exibir os nutrientes e quantidade
       No css , aplica scrollhorizontal e, mobile -->
       <table>
        <!--  thead : Representa o cabeçalho da tabela -->
        <thead>
            <!-- tr cria uma linha -->
           <tr>
            <!-- th Celila de titulos que fica em negrito por padrão, esta definido a coluna -->
             <th>Nutrientes</th>
             <th>Qualidade</th>
           </tr>
           <!--  tbory onde fica linha -->
           <tbody>
            <tr>
                <!-- TD celula de conteudo -->
                <td>Calorias </td>
                <td>320 kcal</td>
            </tr>
            <tr>
                <td>Açúcares</td>
                <td>25g</td>
            </tr>
            <tr>
                <td>Gorduras</td>
                <td>12g</td>
            </tr>
           </tbody>
        </thead>
       </table>

</section>
    </div>
</body>
</html>
